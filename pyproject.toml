[project]
name = "daybreak"
version = "0.1.0"
description = "PayPal refunds within your limits"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi", "uvicorn", "httpx", "anthropic", "jinja2", "python-multipart"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
